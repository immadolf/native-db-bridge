services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ndb_test
      MYSQL_USER: ndb
      MYSQL_PASSWORD: ndb
    ports:
      - "33067:3306"
    command: ["--default-authentication-plugin=mysql_native_password"]

  redis:
    image: redis:7
    ports:
      - "6389:6379"

  mongo:
    image: mongo:7
    ports:
      - "27027:27017"
